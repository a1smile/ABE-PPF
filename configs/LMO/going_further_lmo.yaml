enable_rsmrq: false
enable_robust_vote: false
enable_kde_refine: false
store_pair_features: false
seed: 0
sampling_leaf: 15.0
normal_k: 5
angle_step_deg: 12.0
scene_ref_sampling_rate: 20
pos_thresh: 20.0
rot_thresh_deg: 20.0
registration_runs: 1
visualize: false
distance_step_ratio: 0.6
adaptive_downsample: true
adaptive_downsample_apply_to: scene
adaptive_downsample_cfg:
  no_downsample_thresh: 450
  mid_thresh: 1500
  large_thresh: 3000
  target_mid: 500
  target_large: 450
  target_xlarge: 400
  search_steps: 12
  voxel_min: 0.001
  voxel_max_scale: 0.2
rsmrq:
  L: 2
  T_tables: 4
  w_levels:
  - - 0.20943951
    - 0.20943951
    - 0.20943951
    - 0.003
  - - 0.41887902
    - 0.41887902
    - 0.41887902
    - 0.006
  merge_mode: count
  seed: 0
robust_vote:
  kernel: gaussian
  sigma: 0.6
  tau: 1.0
  B: 1.0
  top_m_per_bucket: 50
  normalize_feature: true
kde_refine:
  use_angle_embedding: true
  top_k: 3
  bandwidth_h: 0.35
  max_iter: 15
  tol: 0.001
  refine_top_pose_k: 1
icp_refine:
  enable: false
  max_iter: 30
  distance_threshold: 5.0
bop_gt:
  t_scale: 1.0
pose_selection:
  enable: false
pose_clustering:
  enable: false
  pos_thresh: 0.02
  rot_thresh_deg: 18.0
  min_cluster_size: 1
  merge_by_score: true
  score_weights:
    size: 0.6
    mean: 0.25
    max: 0.15
going_further_ppf:
  use_method_specific_sampling: true
  method_specific_sampling_apply_to: model
  keep_close_pairs_with_normal_angle_deg: 30.0
  close_pair_min_distance_ratio: 1.0
  candidate_voxel_ratio: 0.5
  max_close_retain_per_anchor: 2
  min_close_extra_distance_ratio: 0.2
  two_ball_enable: true
  small_ball_radius_scale: 1.0
  large_ball_radius_scale: 1.0
  feature_neighbor_steps: 1
  vote_angle_neighbor_steps: 1
  deduplicate_quantized_votes: true
  final_selection_policy: raw_top1_vote
external_method:
  name: going_further_with_ppf
  paper: Hinterstoisser et al., ECCV 2016
  implementation_style: pure_python_repo_reproduction
  comparison_mode: lmo_base_consistent
output:
  root: experiments
  results_dir: experiments/results
  logs_dir: experiments/logs
  tables_dir: experiments/tables
  figures_dir: experiments/figures
final_pose_policy: raw_top1_vote
