enable_rsmrq: false
enable_robust_vote: false
enable_kde_refine: false
store_pair_features: false
seed: 0

sampling_leaf: 0.004
normal_k: 10
angle_step_deg: 12.0
scene_ref_sampling_rate: 5

pos_thresh: 0.02
rot_thresh_deg: 20.0
registration_runs: 1
visualize: false
distance_step_ratio: 0.6

adaptive_downsample: true
adaptive_downsample_apply_to: both

adaptive_downsample_cfg:
  no_downsample_thresh: 450
  mid_thresh: 1500
  large_thresh: 3000
  target_mid: 500
  target_large: 450
  target_xlarge: 400
  search_steps: 12
  voxel_min: 0.0001
  voxel_max_scale: 0.2

rsmrq:
  L: 2
  T_tables: 4
  w_levels:
    - [0.20943951, 0.20943951, 0.20943951, 0.003]
    - [0.41887902, 0.41887902, 0.41887902, 0.006]
  merge_mode: count
  seed: 0

robust_vote:
  kernel: gaussian
  sigma: 0.6
  tau: 1.0
  B: 1.0
  top_m_per_bucket: 50
  normalize_feature: true

kde_refine:
  use_angle_embedding: true
  top_k: 3
  bandwidth_h: 0.35
  max_iter: 15
  tol: 0.001
  refine_top_pose_k: 1

icp_refine:
  enable: false
  max_iter: 30
  distance_threshold: 0.005

bop_gt:
  t_scale: 1.0

pose_selection:
  enable: false

pose_clustering:
  enable: false
  pos_thresh: 0.02
  rot_thresh_deg: 18.0
  min_cluster_size: 1
  merge_by_score: true
  score_weights:
    size: 0.60
    mean: 0.25
    max: 0.15

edge_enhanced_ppf:
  model_pair_normal_angle_min_deg: 5.0
  model_pair_normal_angle_max_deg: 175.0
  scene_sampling_use_edge_preservation: true
  scene_candidate_voxel_ratio: 0.60
  scene_non_edge_voxel_scale: 1.15
  edge_normal_var_percentile: 75.0
  edge_curvature_percentile: 75.0
  edge_normal_var_abs_deg: 18.0
  edge_curvature_abs: 0.015
  edge_knn: 12
  min_edge_fraction: 0.15
  max_edge_fraction: 0.45
  intelligent_sampling_radius_scale: 1.0
  verification_top_n: 9
  verification_vote_split_ratio: 0.50
  verification_accept_high: 0.70
  verification_accept_low: 0.60
  verification_roi_scale: 1.40
  verification_edge_match_radius: 0.008
  verification_cluster_eps_scale: 0.08
  verification_cluster_min_points: 6
  final_selection_policy: edge_verify

external_method:
  name: edge_enhanced_ppf
  paper: "Liu et al., Computational Visual Media 2023/2024"
  implementation_style: pure_python_repo_reproduction
  comparison_mode: stanford_base_consistent_plus_method_scene_sampling

output:
  root: experiments
  results_dir: experiments/results
  logs_dir: experiments/logs
  tables_dir: experiments/tables
  figures_dir: experiments/figures

final_pose_policy: edge_verify
